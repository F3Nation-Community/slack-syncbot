# Validates squash-merge PR titles follow Conventional Commits (see CONTRIBUTING.md).
# Dependabot titles are set via .github/dependabot.yml (chore(deps): …).
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - name: Skip Conventional Commits check for Dependabot
        if: github.actor == 'dependabot[bot]'
        run: echo "Dependabot PR; title policy is .github/dependabot.yml commit-message prefix."

      - name: Validate PR title
        if: github.actor != 'dependabot[bot]'
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
