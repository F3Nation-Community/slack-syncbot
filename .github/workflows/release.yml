# Automated semver releases via python-semantic-release. Commits/tags/releases use the
# GitHub git API so bot commits show as Verified (web-flow signing).
# Runs only on sprocktech/syncbot — forks must not mint a second release stream.
# See docs/DEVELOPMENT.md — Releases & Versioning.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  semantic-release:
    if: >-
      github.repository == 'sprocktech/syncbot' &&
      github.ref == 'refs/heads/main' && (
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       !startsWith(github.event.head_commit.message, 'chore(release):') &&
       !startsWith(github.event.head_commit.message, 'chore: sync requirements'))
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: psr
        uses: python-semantic-release/python-semantic-release@v9.21.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit: "false"
          tag: "false"
          push: "false"
          vcs_release: "false"
          changelog: "true"

      - name: Commit, tag, and publish release (GitHub API)
        if: ${{ steps.psr.outputs.released == 'true' }}
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.psr.outputs.version }}
          RELEASE_NOTES: ${{ steps.psr.outputs.release_notes }}
          TAG: ${{ steps.psr.outputs.tag }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const version = process.env.VERSION;
            const tag = process.env.TAG || version;
            let notes = process.env.RELEASE_NOTES || '';
            if (!notes.trim()) {
              notes = `Release ${version}`;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const parentSha = context.sha;

            const pyproject = fs.readFileSync('pyproject.toml', 'utf8');
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');

            const { data: parentCommit } = await github.rest.git.getCommit({
              owner,
              repo,
              commit_sha: parentSha,
            });

            const { data: tree } = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: parentCommit.tree.sha,
              tree: [
                { path: 'pyproject.toml', mode: '100644', type: 'blob', content: pyproject },
                { path: 'CHANGELOG.md', mode: '100644', type: 'blob', content: changelog },
              ],
            });

            const message = [
              `chore(release): ${version} [skip ci]`,
              '',
              'Automated release by python-semantic-release.',
            ].join('\n');

            const { data: commit } = await github.rest.git.createCommit({
              owner,
              repo,
              message,
              tree: tree.sha,
              parents: [parentSha],
            });

            await github.rest.git.updateRef({
              owner,
              repo,
              ref: `heads/${branch}`,
              sha: commit.sha,
            });

            try {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tag}`,
                sha: commit.sha,
              });
            } catch (e) {
              core.warning(`Tag ${tag} may already exist: ${e}`);
            }

            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: tag,
              body: notes,
            });
